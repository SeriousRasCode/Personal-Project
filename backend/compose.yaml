name: hydrojimma

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: hydrojimma
      POSTGRES_USER: hydrojimma
      POSTGRES_PASSWORD: hydrojimma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrojimma -d hydrojimma"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  localstack:
    image: localstack/localstack:2026.8.4
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fs http://localhost:4566/_localstack/health | grep -q '\"s3\":' "
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  localstack-init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - >-
        aws --endpoint-url http://localstack:4566 s3api create-bucket
        --bucket hydrojimma || true;
        aws --endpoint-url http://localstack:4566 s3api head-bucket
        --bucket hydrojimma
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  localstack_data:
